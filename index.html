    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ecfdf5; /* Light green background */
            background-image: linear-gradient(135deg, #d1fae5 0%, #ecfdf5 50%, #a7f3d0 100%); /* Green gradient */
        }
        /* Custom scrollbar for affirmation feed */
        #affirmationFeedArea::-webkit-scrollbar { width: 6px; }
        #affirmationFeedArea::-webkit-scrollbar-track { background: #d1fae5; border-radius: 10px; }
        #affirmationFeedArea::-webkit-scrollbar-thumb { background: #34d399; border-radius: 10px; } /* Emerald color */
        #affirmationFeedArea::-webkit-scrollbar-thumb:hover { background: #10b981; } /* Darker Emerald */

        textarea:focus, button:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.3); /* Emerald focus ring */
        }
        #affirmButton {
            transition: background-color 0.3s ease-in-out, transform 0.2s ease-in-out, box-shadow 0.2s ease;
        }
        #affirmButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
         #affirmButton:active {
            transform: translateY(0px);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
        }
        /* Style for the single positive acknowledgement message (now one of the 500 affirmations) */
        .positive-acknowledgement {
             padding: 8px 16px;
             font-size: 1rem;
             border-radius: 6px;
             display: inline-block;
             background-color: #a7f3d0; /* Light Emerald */
             color: #065f46; /* Dark Emerald text */
             animation: fadeInMessage 0.5s ease-out;
        }
        /* Simple fade-in animation */
        @keyframes fadeInMessage {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

         /* Style for affirmation feed items (user's personalized affirmations) */
        .affirmation-item {
            border-left: 4px solid #34d399; /* Emerald border */
            transition: background-color 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
             animation: fadeInItem 0.5s ease-out; /* Animation for new items */
        }
         @keyframes fadeInItem {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .affirmation-item:hover {
            background-color: #d1fae5; /* Lighter Emerald */
            border-left-color: #10b981; /* Darker Emerald */
        }
        /* Style for the remove button */
        .remove-btn {
            font-size: 0.8rem;
            padding: 2px 6px;
            margin-left: 10px;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .remove-btn:hover {
            background-color: #ef4444; /* Red background on hover */
            color: white;
        }
    </style>

        /**
         * Shows a temporary message (e.g., for errors) in the acknowledgement area.
         */
        function showTemporaryMessage(messageText) {
            acknowledgementArea.innerHTML = '';
            const messageElement = document.createElement('p');
            messageElement.textContent = messageText;
            messageElement.className = 'text-red-600 font-medium text-center';
            acknowledgementArea.appendChild(messageElement);
            ackPlaceholder.style.display = 'none';

             setTimeout(() => {
                 if (acknowledgementArea.contains(messageElement)) {
                     acknowledgementArea.removeChild(messageElement);

                          acknowledgementArea.appendChild(ackPlaceholder);
                     }
                 }
             }, 3000);
        }

        /**
         * Displays a single UNIQUE affirmation from the 500 list, using localStorage.
         */
        function showSingleUniqueAffirmationFromPool() { // Renamed for clarity
            acknowledgementArea.innerHTML = '';
            ackPlaceholder.style.display = 'none';

            let availableAffirmations = [];
            try {
                const storedAffirmations = localStorage.getItem(AVAILABLE_AFFIRMATIONS_KEY);
                availableAffirmations = storedAffirmations ? JSON.parse(storedAffirmations) : null;
                if (!Array.isArray(availableAffirmations)) {
                    console.warn("Invalid or missing available affirmations pool in storage. Initializing.");
                    availableAffirmations = [...fullAffirmationPool];
                    localStorage.setItem(AVAILABLE_AFFIRMATIONS_KEY, JSON.stringify(availableAffirmations));
                }
            } catch (error) {
                console.error("Error reading/parsing available affirmations pool from localStorage:", error);
                availableAffirmations = [...fullAffirmationPool];
                localStorage.setItem(AVAILABLE_AFFIRMATIONS_KEY, JSON.stringify(availableAffirmations));
            }

            if (availableAffirmations.length === 0) {
                console.log("Affirmation pool empty, resetting.");
                availableAffirmations = [...fullAffirmationPool];
            }

            const randomIndex = Math.floor(Math.random() * availableAffirmations.length);
            const uniqueAffirmation = availableAffirmations[randomIndex];
            availableAffirmations.splice(randomIndex, 1);

            localStorage.setItem(AVAILABLE_AFFIRMATIONS_KEY, JSON.stringify(availableAffirmations));

            const msgElement = document.createElement('span');
            msgElement.textContent = uniqueAffirmation;
            msgElement.className = 'positive-acknowledgement';
            acknowledgementArea.appendChild(msgElement);
        }

                availablePrefixes = [...fullPersonalizationPrefixPool];

        /**
         * Loads user's saved affirmations from local storage and displays them in the feed.
         */
        function loadSavedAffirmations() { // Renamed for clarity
            while (affirmationFeedArea.children.length > 1) {
                affirmationFeedArea.removeChild(affirmationFeedArea.lastChild);
            }
            noAffirmationsMessage.style.display = 'block';

            const affirmations = JSON.parse(localStorage.getItem(AFFIRMATIONS_STORAGE_KEY) || '[]');

            if (affirmations.length > 0) {
                noAffirmationsMessage.style.display = 'none';
                affirmations.slice().reverse().forEach(affirmation => {
                    addAffirmationToFeed(affirmation.id, affirmation.text, false);
                });
            }
             checkEmptyFeed();
        }

        /**
         * Adds a single user affirmation (with personalized text) to the top of the feed visually.
         */
        function addAffirmationToFeed(id, personalizedText, animate = true) {
            const sanitizedText = personalizedText.replace(/</g, "&lt;").replace(/>/g, "&gt;");

            const affirmationElement = document.createElement('div');
            affirmationElement.className = 'affirmation-item bg-white p-4 rounded-lg shadow-sm flex justify-between items-start';
            affirmationElement.setAttribute('data-id', id);

            if (animate) {
                 affirmationElement.style.animation = 'fadeInItem 0.5s ease-out forwards';
            }

            const textElement = document.createElement('p');
            textElement.className = 'text-gray-700 leading-relaxed mr-2 flex-grow';
            textElement.innerHTML = sanitizedText;

            const removeButton = document.createElement('button');
            removeButton.className = 'remove-btn text-red-500 hover:text-red-700 font-medium border border-red-300 rounded whitespace-nowrap';
            removeButton.textContent = 'Remove';
            removeButton.onclick = () => removeSavedAffirmation(id); // Renamed for clarity

            affirmationElement.appendChild(textElement);
            affirmationElement.appendChild(removeButton);

            affirmationFeedArea.insertBefore(affirmationElement, noAffirmationsMessage.nextSibling);
             checkEmptyFeed();
        }

         /**
         * Removes a user's saved affirmation from the DOM and local storage.
         */
        function removeSavedAffirmation(id) { // Renamed for clarity
            const elementToRemove = affirmationFeedArea.querySelector(`div[data-id="${id}"]`);
            if (elementToRemove) {
                elementToRemove.remove();
            }

            let affirmations = JSON.parse(localStorage.getItem(AFFIRMATIONS_STORAGE_KEY) || '[]');
            affirmations = affirmations.filter(affirmation => affirmation.id !== id);
            localStorage.setItem(AFFIRMATIONS_STORAGE_KEY, JSON.stringify(affirmations));

            checkEmptyFeed();
        }

        /**
         * Checks if the feed of saved affirmations is empty and toggles the placeholder message.
         */
        function checkEmptyFeed() {
            const affirmationCount = affirmationFeedArea.querySelectorAll('.affirmation-item').length;
            if (affirmationCount === 0) {
                noAffirmationsMessage.style.display = 'block';
            } else {
                noAffirmationsMessage.style.display = 'none';
            }
        }

         /**
         * Saves a new user affirmation object (with personalized text) to local storage.
         */
        function saveUserAffirmation(affirmation) { // Renamed for clarity
            let affirmations = JSON.parse(localStorage.getItem(AFFIRMATIONS_STORAGE_KEY) || '[]');
            affirmations.push(affirmation);
            const MAX_AFFIRMATIONS = 100;
            if (affirmations.length > MAX_AFFIRMATIONS) {
                 affirmations = affirmations.slice(affirmations.length - MAX_AFFIRMATIONS);
                 console.warn(`Saved affirmation limit (${MAX_AFFIRMATIONS}) reached. Removed oldest affirmations.`);
            }
            localStorage.setItem(AFFIRMATIONS_STORAGE_KEY, JSON.stringify(affirmations));
        }


        // --- Event Listeners ---

        /**
         * Handles the affirm button click.
         */
        affirmButton.addEventListener('click', () => {
            const originalAffirmationText = affirmationInput.value.trim();

            if (originalAffirmationText) {
                affirmButton.disabled = true;
                affirmButton.classList.add('opacity-75', 'cursor-not-allowed');

                // --- Personalization Step ---
                const prefix = getUniquePersonalizationPrefix(); // Get unique prefix

                let affirmationBody = originalAffirmationText;
                if (affirmationBody.charAt(0) === affirmationBody.charAt(0).toUpperCase() && affirmationBody.charAt(0) !== 'I' && affirmationBody.charAt(0).match(/[a-z]/i)) {
                     affirmationBody = affirmationBody.charAt(0).toLowerCase() + affirmationBody.slice(1);
                }
                if (affirmationBody.endsWith('.')) {
                    affirmationBody = affirmationBody.slice(0, -1);
                }
                const personalizedText = `${prefix} ${affirmationBody}.`;
                // --- End Personalization Step ---


                const newUserAffirmation = { // Renamed for clarity
                    id: `affirm-${Date.now()}-${Math.random().toString(36).substring(2, 9)}`,
                    text: personalizedText
                };

                // Save and display the user's personalized affirmation
                saveUserAffirmation(newUserAffirmation);
                addAffirmationToFeed(newUserAffirmation.id, newUserAffirmation.text, true);

                // Show a unique affirmation from the 500 pool in the acknowledgement area
                showSingleUniqueAffirmationFromPool();

                affirmationInput.value = '';

                 setTimeout(() => {
                    affirmButton.disabled = false;
                    affirmButton.classList.remove('opacity-75', 'cursor-not-allowed');
                }, 300);

            } else {
                showTemporaryMessage('Please type an affirmation!');
            }
        });

        /**
         * Allows submitting with Enter key in the textarea.
         */
        affirmationInput.addEventListener('keydown', (event) => {
             if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                if (affirmationInput.value.trim() && !affirmButton.disabled) {
                    affirmButton.click();
                }
            }
        });

        // --- Initial Load ---
        document.addEventListener('DOMContentLoaded', () => {
             loadSavedAffirmations(); // Load user's saved affirmations
             // Ensure acknowledgement placeholder is correct on load
             if (!acknowledgementArea.querySelector('.positive-acknowledgement')) {
                 ackPlaceholder.style.display = 'block';
             } else {
                 ackPlaceholder.style.display = 'none';
             }
        });
